<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Редактирование{% else %}Создание{% endif %} статьи</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        input, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #1e7e34; }
    </style>
</head>
<body>
    <h1>{% if object %}Редактирование статьи{% else %}Создание новой статьи{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
    </form>
    <br>
    <a href="{% url 'blog:post_list' %}">← Отмена</a>
</body>
</html>
