<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог продуктов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Каталог продуктов</h1>
    <a href="{% url 'catalog:product_create' %}" class="btn btn-primary mb-3">Добавить продукт</a>

    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatewords:20 }}</p>
                    <p class="card-text"><strong>Цена: {{ product.price }} руб.</strong></p>
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-info">Подробнее</a>
                    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">Редактировать</a>
                    <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Продуктов пока нет.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
