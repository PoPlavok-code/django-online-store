<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p><strong>Цена: {{ product.price }} руб.</strong></p>
    <p>Категория: {{ product.category }}</p>
    
    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">← Назад</a>
    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
</div>
</body>
</html>
