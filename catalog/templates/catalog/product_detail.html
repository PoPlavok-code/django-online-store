{% extends "catalog/base.html" %}

{% block title %}{{ product.name }} - Online Store{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">{{ product.name }}</h1>
            <p class="card-text fs-4"><strong>Цена: {{ product.price }} руб.</strong></p>
            <p class="card-text">{{ product.description }}</p>
            <a href="{% url 'home' %}" class="btn btn-secondary">← Назад к каталогу</a>
        </div>
    </div>
</div>
{% endblock %}
